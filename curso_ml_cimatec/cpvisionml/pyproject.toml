[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_cpvisionml"
version = "0.0.1"
description = "Computer Vision Test Project"
authors = [
  { name = "PQFreitas" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "deepface>=0.0.103",
    "ipython",
    "jupyterlab",
    "keras>=3.12.4",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "tqdm",
    "typer",
    "werkzeug>=3.1.9",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["module_cpvisionml"]
include = ["pyproject.toml", "module_cpvisionml/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_cpvisionml"]
force-sort-within-sections = true

